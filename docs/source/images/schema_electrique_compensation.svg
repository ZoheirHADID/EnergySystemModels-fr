<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Compensation d'un moteur : ce que calcule Electrical.MotorPFCompensation">
<title>Compensation d'un moteur : ce que calcule Electrical.MotorPFCompensation</title>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker><marker id="fleche_cote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b46a00"/></marker><marker id="fleche_flux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2670a8"/></marker></defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="24.0" y="32.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Compensation du facteur de puissance d'un moteur — plaque, limite, batterie retenue</text>
<polyline points="20.00,210.00 150.00,210.00" fill="none" stroke="#c0392b" stroke-width="3.2" stroke-linejoin="round"/>
<circle cx="36.0" cy="186.0" r="11" fill="#1d5f86"/>
<text x="36.0" y="190.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">1</text>
<text x="96.0" y="198.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">ligne 400 V</text>
<circle cx="190" cy="210.0" r="34.0" fill="#ffffff" stroke="#1f2933" stroke-width="2"/>
<text x="190.0" y="218.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" font-weight="600">M</text>
<text x="190.0" y="272.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Moteur</text>
<text x="190.0" y="288.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">I, cos φ (plaque)</text>
<circle cx="224.0" cy="176.0" r="11" fill="#1d5f86"/>
<text x="224.0" y="180.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">2</text>
<polyline points="150.00,210.00 150.00,330.00 250.00,330.00" fill="none" stroke="#8e44ad" stroke-width="2.6" stroke-dasharray="6 4" stroke-linejoin="round"/>
<line x1="196.0" y1="314.0" x2="196.0" y2="326.0" stroke="#8e44ad" stroke-width="2.4"/>
<line x1="196.0" y1="334.0" x2="196.0" y2="346.0" stroke="#8e44ad" stroke-width="2.4"/>
<text x="206.0" y="334.0" fill="#8e44ad" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="600">C</text>
<rect x="268.0" y="292.0" width="250.0" height="76.0" rx="6" fill="#f3f4f5" stroke="#8a939c" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="393.0" y="386.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Batterie de condensateurs</text>
<text x="393.0" y="402.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">gamme normalisée : 5, 10, 15, 20, 25… kVAr</text>
<circle cx="268.0" cy="292.0" r="11" fill="#8a939c"/>
<text x="268.0" y="296.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">3</text>
<text x="393.0" y="406.0" fill="#8a939c" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11">Qc_normalise_kVAr</text>
<polyline points="700.00,360.00 930.00,360.00 930.00,250.00 700.00,360.00" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round"/>
<text x="815.0" y="380.0" fill="#c0392b" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="600">P (kW)</text>
<text x="938.0" y="305.0" fill="#8e44ad" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="600">Q (kVAr)</text>
<text x="845.0" y="297.0" fill="#1f2933" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12">S</text>
<line x1="700.0" y1="305.0" x2="930.0" y2="305.0" stroke="#1e7b4a" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="938.0" y="309.0" fill="#1e7b4a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11">Q_limite = 0,5 P</text>
<line x1="904.0" y1="250.0" x2="904.0" y2="324.8" stroke="#8a939c" stroke-width="2.4" marker-end="url(#fleche)"/>
<text x="910.0" y="283.0" fill="#8a939c" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="600">Qc</text>
<circle cx="684.0" cy="344.0" r="11" fill="#1e7b4a"/>
<text x="684.0" y="348.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">4</text>
<circle cx="38.0" cy="560.0" r="11" fill="#1d5f86"/>
<text x="38.0" y="564.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">1</text>
<text x="58.0" y="564.5" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Ligne</text>
<text x="200.0" y="564.5" fill="#1d5f86" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">U (400 V triphasé), I nominal, cos φ de plaque</text>
<circle cx="38.0" cy="587.0" r="11" fill="#1d5f86"/>
<text x="38.0" y="591.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">2</text>
<text x="58.0" y="591.5" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Moteur</text>
<text x="200.0" y="591.5" fill="#1d5f86" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">P = √3·U·I·cos φ ; Q = P·tan(arccos cos φ)</text>
<circle cx="38.0" cy="614.0" r="11" fill="#8a939c"/>
<text x="38.0" y="618.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">3</text>
<text x="58.0" y="618.5" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Condensateurs</text>
<text x="200.0" y="618.5" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">Qc_theorique = Q − Q_cible, arrondi à la gamme normalisée (jamais une valeur continue)</text>
<circle cx="38.0" cy="641.0" r="11" fill="#1e7b4a"/>
<text x="38.0" y="645.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">4</text>
<text x="58.0" y="645.5" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Nouvel état</text>
<text x="200.0" y="645.5" fill="#1e7b4a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">Q_new = Q − Qc ; cos φ_new ; I_new ; gain_I ; gain_pertes = 1 − (I_new/I)²</text>
</svg>
