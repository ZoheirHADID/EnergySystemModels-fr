<line x1="160.0" y1="270.0" x2="790.0" y2="270.0" stroke="#7b8794" stroke-width="1.0" stroke-dasharray="10 4 2 4"/>
<text x="370.0" y="226.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">fluid = 'water'</text>
<text x="370.0" y="242.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">T_fluid = 70   # °C</text>
<text x="370.0" y="258.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">F_m3h = 20      # m3/h</text>
<line x1="230.0" y1="300.0" x2="340.0" y2="300.0" stroke="#2670a8" stroke-width="2.4" marker-end="url(#fleche_flux)"/>
<text x="370.0" y="304.0" fill="#2670a8" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">v = 1.08 m/s · régime turbulent</text>
<text x="210.0" y="178.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">insulation = 'laine minérale'</text>
<line x1="280.0" y1="346.0" x2="280.0" y2="418.0" stroke="#7b8794" stroke-width="1.0"/>
<text x="286.0" y="422.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">material = 'Acier'</text>
<line x1="430.0" y1="154.0" x2="430.0" y2="100.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#fleche_chaud)"/>
<line x1="560.0" y1="154.0" x2="560.0" y2="100.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#fleche_chaud)"/>
<line x1="690.0" y1="154.0" x2="690.0" y2="100.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#fleche_chaud)"/>
<text x="560.0" y="88.0" fill="#c0392b" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">q_total = 8050 W</text>
<text x="190.0" y="124.0" fill="#c0392b" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">Tc = 28.9 °C</text>
<text x="190.0" y="140.0" fill="#c0392b" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">surface de l'isolant</text>
<line x1="166.0" y1="188.0" x2="166.0" y2="352.0" stroke="#b46a00" stroke-width="1.2" marker-start="url(#fleche_cote)" marker-end="url(#fleche_cote)"/>
<text x="166.0" y="270.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13"></text>
<text x="156.0" y="262.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">DN = 80</text>
<text x="156.0" y="280.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">de = 0.0889 m</text>
<text x="156.0" y="296.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">di = 0.0809 m</text>
<line x1="776.0" y1="352.0" x2="776.0" y2="382.0" stroke="#b46a00" stroke-width="1.2" marker-start="url(#fleche_cote)" marker-end="url(#fleche_cote)"/>
<text x="776.0" y="367.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13"></text>
<text x="784.0" y="422.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">insulation_thickness = 0.04 m</text>
<line x1="776.0" y1="382.0" x2="776.0" y2="408.0" stroke="#b46a00" stroke-width="1.0"/>
<line x1="190.0" y1="452.0" x2="760.0" y2="452.0" stroke="#b46a00" stroke-width="1.2" marker-start="url(#fleche_cote)" marker-end="url(#fleche_cote)"/>
<text x="475.0" y="452.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13"></text>
<text x="475.0" y="472.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12">L_tube = 500 m</text>
<rect x="24.0" y="508.0" width="852.0" height="60.0" rx="4" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="1.0"/>
<text x="34.0" y="528.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">q_total = convection naturelle (7909 W) + rayonnement (141 W, emissivity = 0.01) depuis la surface de l'isolant.</text>
<text x="34.0" y="544.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">T_fluid est constante sur toute la longueur : le modèle ne calcule pas le refroidissement du fluide.</text>
<text x="34.0" y="560.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Valeurs calculées par PipeInsulationAnalysis.calculate() sur l'exemple ; épaisseurs hors échelle.</text>
</svg>
