<rect x="40.0" y="534.0" width="740.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="1.0"/>
<text x="50.0" y="554.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Chaque face a sa température Tp ; Ta = 25 °C pour toutes. 'isolated': True annule le flux de la face.</text>
<text x="50.0" y="570.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Faces verticales et horizontales (dessus, dessous) n'ont pas la même corrélation de convection naturelle.</text>
