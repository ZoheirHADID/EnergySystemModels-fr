<line x1="762.0" y1="126.0" x2="858.0" y2="185.2" stroke="#c0392b" stroke-width="1.6" marker-end="url(#fleche_chaud)"/>
<line x1="858.0" y1="272.2" x2="762.0" y2="220.8" stroke="#2670a8" stroke-width="1.6" marker-end="url(#fleche_froid)"/>
<text x="696.0" y="80.6" fill="#c0392b" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">fluide 85 °C</text>
<text x="930.0" y="227.1" fill="#c0392b" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">45 °C</text>
<text x="696.0" y="182.0" fill="#2670a8" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">air 64,7 °C</text>
<text x="930.0" y="310.9" fill="#2670a8" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">air 30 °C</text>
<line x1="692.0" y1="88.6" x2="692.0" y2="164.0" stroke="#b46a00" stroke-width="1.2" marker-start="url(#fleche_cote)" marker-end="url(#fleche_cote)"/>
<line x1="928.0" y1="237.1" x2="928.0" y2="292.9" stroke="#b46a00" stroke-width="1.2" marker-start="url(#fleche_cote)" marker-end="url(#fleche_cote)"/>
<text x="640.0" y="382.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Lecture</text>
<text x="640.0" y="400.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">ΔT chaud = Ti_fluid − To_air = 20,3 K</text>
<text x="640.0" y="418.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">ΔT froid = To_fluid − Ti_air = 15,0 K</text>
<text x="640.0" y="436.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">DTLM (moy. log.) = 17,52 K</text>
<text x="640.0" y="470.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Ce qui fixe R2</text>
<text x="640.0" y="488.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">R1 = NUT côté air d'une baie : il ne dépend</text>
<text x="640.0" y="506.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">que de U, nb_rangs, du pas et du diamètre,</text>
<text x="640.0" y="524.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">pas de L_tube ni de largeur_baie (Stn et Sf</text>
<text x="640.0" y="542.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">leur sont tous deux proportionnels).</text>
<text x="640.0" y="590.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Étapes 4 à 6 (fond orangé)</text>
<text x="640.0" y="608.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">= le cœur thermique ; les autres étapes</text>
<text x="640.0" y="626.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">sont du dimensionnement d'équipement.</text>
</svg>
