<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="Aéroréfrigérant — méthode de calcul R1/R2/R3 et DTLM">
<title>Aéroréfrigérant — méthode de calcul R1/R2/R3 et DTLM</title>
<defs><marker id="fleche_chaud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker><marker id="fleche_froid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2670a8"/></marker></defs>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker><marker id="fleche_cote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b46a00"/></marker><marker id="fleche_flux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2670a8"/></marker></defs>
<rect width="960" height="720" fill="#ffffff"/>
<text x="24.0" y="30.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Ce que fait calculate(), dans l'ordre</text>
<rect x="24.0" y="50.0" width="590.0" height="58.0" rx="6" fill="#f7f9fb" stroke="#1f2933" stroke-width="1.4"/>
<text x="36.0" y="72.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">1  Chaleur à évacuer</text>
<text x="602.0" y="72.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">3360 kW</text>
<text x="36.0" y="94.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">Qth_fluid = F_fluid · Cp_fluid · (Ti_fluid − To_fluid)</text>
<line x1="64.0" y1="108.0" x2="64.0" y2="120.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#fleche)"/>
<rect x="24.0" y="122.0" width="590.0" height="58.0" rx="6" fill="#f7f9fb" stroke="#1f2933" stroke-width="1.4"/>
<text x="36.0" y="144.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">2  Coefficient global U (tube nu)</text>
<text x="602.0" y="144.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">U = 850 W/m².K</text>
<text x="36.0" y="166.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">water 850 · hydrocarbure leger 540 · Gasoil leger 400 ; sinon U à saisir</text>
<line x1="64.0" y1="180.0" x2="64.0" y2="192.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#fleche)"/>
<rect x="24.0" y="194.0" width="590.0" height="58.0" rx="6" fill="#f7f9fb" stroke="#1f2933" stroke-width="1.4"/>
<text x="36.0" y="216.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">3  Géométrie d'une baie</text>
<text x="602.0" y="216.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">Sf = 36 m² · Stn = 270 m²</text>
<text x="36.0" y="238.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">Ntr = 47, Ntf = 282 ; nb_rangs = 6 (écart 55 K) → V_air = 2,75 m/s</text>
<line x1="64.0" y1="252.0" x2="64.0" y2="264.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#fleche)"/>
<rect x="24.0" y="266.0" width="590.0" height="58.0" rx="6" fill="#fdf1ea" stroke="#1f2933" stroke-width="1.4"/>
<text x="36.0" y="288.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">4  Nombres adimensionnels</text>
<text x="602.0" y="288.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">R3 = 0,727 · R1 = 1,98</text>
<text x="36.0" y="310.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">R3 = (Ti_f − To_f)/(Ti_f − Ti_air)   R1 = U·Stn/(V_air·Sf·ρ_air·Cp_air)</text>
<line x1="64.0" y1="324.0" x2="64.0" y2="336.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#fleche)"/>
<rect x="24.0" y="338.0" width="590.0" height="58.0" rx="6" fill="#fdf1ea" stroke="#1f2933" stroke-width="1.4"/>
<text x="36.0" y="360.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">5  Résolution de R2 (brentq, ]0 ; 1[)</text>
<text x="602.0" y="360.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">R2 = 0,630 → 64,7 °C</text>
<text x="36.0" y="382.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">R1 = ln((1 − R2)/(1 − R3)) / (R3/R2 − 1) ;  To_air = Ti_air + R2·(Ti_f − Ti_air)</text>
<line x1="64.0" y1="396.0" x2="64.0" y2="408.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#fleche)"/>
<rect x="24.0" y="410.0" width="590.0" height="58.0" rx="6" fill="#fdf1ea" stroke="#1f2933" stroke-width="1.4"/>
<text x="36.0" y="432.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">6  DTLM et UA</text>
<text x="602.0" y="432.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">DTLM = 17,52 K · UA = 192 kW/K</text>
<text x="36.0" y="454.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">DTLM contre-courant sur (Ti_f − To_air) et (To_f − Ti_air) ;  UA = Qth_fluid / DTLM</text>
<line x1="64.0" y1="468.0" x2="64.0" y2="480.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#fleche)"/>
<rect x="24.0" y="482.0" width="590.0" height="58.0" rx="6" fill="#f7f9fb" stroke="#1f2933" stroke-width="1.4"/>
<text x="36.0" y="504.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">7  Nombre de baies</text>
<text x="602.0" y="504.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">0,83 → 1 baie(s)</text>
<text x="36.0" y="526.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">Qth_air = V_air·Sf·ρ·Cp·(To_air − Ti_air) ; nb_baie = Qth_fluid/Qth_air → max(1, ceil)</text>
<line x1="64.0" y1="540.0" x2="64.0" y2="552.0" stroke="#7b8794" stroke-width="1.6" marker-end="url(#fleche)"/>
<rect x="24.0" y="554.0" width="590.0" height="58.0" rx="6" fill="#f7f9fb" stroke="#1f2933" stroke-width="1.4"/>
<text x="36.0" y="576.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">8  Ventilation</text>
<text x="602.0" y="576.0" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">2 × 20 kW = 40 kW</text>
<text x="36.0" y="598.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">dmin_vent (40 % de Sf) ; F_vent ; P_vent = F·ΔP_stat/(η_stat·η_trans), au 5 kW supérieur</text>
<text x="640.0" y="30.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="600">Profil de températures</text>
<line x1="690.0" y1="330.0" x2="930.0" y2="330.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="690.0" y1="330.0" x2="690.0" y2="70.0" stroke="#1f2933" stroke-width="1.4"/>
<line x1="686.0" y1="330.0" x2="690.0" y2="330.0" stroke="#1f2933" stroke-width="1.0"/>
<text x="682.0" y="334.0" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">20</text>
<line x1="686.0" y1="292.9" x2="690.0" y2="292.9" stroke="#1f2933" stroke-width="1.0"/>
<text x="682.0" y="296.9" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">30</text>
<line x1="686.0" y1="255.7" x2="690.0" y2="255.7" stroke="#1f2933" stroke-width="1.0"/>
<text x="682.0" y="259.7" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">40</text>
<line x1="686.0" y1="218.6" x2="690.0" y2="218.6" stroke="#1f2933" stroke-width="1.0"/>
<text x="682.0" y="222.6" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">50</text>
<line x1="686.0" y1="181.4" x2="690.0" y2="181.4" stroke="#1f2933" stroke-width="1.0"/>
<text x="682.0" y="185.4" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">60</text>
<line x1="686.0" y1="144.3" x2="690.0" y2="144.3" stroke="#1f2933" stroke-width="1.0"/>
<text x="682.0" y="148.3" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">70</text>
<line x1="686.0" y1="107.1" x2="690.0" y2="107.1" stroke="#1f2933" stroke-width="1.0"/>
<text x="682.0" y="111.1" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">80</text>
<line x1="686.0" y1="70.0" x2="690.0" y2="70.0" stroke="#1f2933" stroke-width="1.0"/>
<text x="682.0" y="74.0" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">90</text>
<text x="682.0" y="58.0" fill="#7b8794" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">°C</text>
<text x="810.0" y="350.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">position le long du faisceau</text>
<polyline points="690.00,88.57 696.00,92.86 702.00,97.12 708.00,101.34 714.00,105.53 720.00,109.69 726.00,113.82 732.00,117.92 738.00,121.99 744.00,126.02 750.00,130.03 756.00,134.00 762.00,137.95 768.00,141.87 774.00,145.75 780.00,149.61 786.00,153.44 792.00,157.24 798.00,161.01 804.00,164.75 810.00,168.47 816.00,172.15 822.00,175.81 828.00,179.44 834.00,183.04 840.00,186.62 846.00,190.17 852.00,193.69 858.00,197.19 864.00,200.66 870.00,204.10 876.00,207.52 882.00,210.91 888.00,214.28 894.00,217.62 900.00,220.93 906.00,224.23 912.00,227.49 918.00,230.73 924.00,233.95 930.00,237.14" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linejoin="round"/>
