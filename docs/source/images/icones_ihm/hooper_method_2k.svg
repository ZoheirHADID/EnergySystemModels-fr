  <metadata>{"standard": "pictogramme ESM", "ref": "", "name": "Singularité 2K (Hooper)", "ports": [{"id": "port-w", "x": 8, "y": 50, "dir": "w", "role": "inlet"}, {"id": "port-e", "x": 92, "y": 50, "dir": "e", "role": "outlet"}]}</metadata>
