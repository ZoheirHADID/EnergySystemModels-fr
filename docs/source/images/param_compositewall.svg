<text x="50.0" y="522.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">he, hi en W/m².K  ·  A = 10 m²  ·  R_total = 1/he + Σ thickness/λ + 1/hi = 2.018 m².K/W  ·  Q = A·(Ti−Te)/R_total</text>
<text x="50.0" y="538.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">material='Air' : lame d'air, résistance lue dans une table par tranche d'épaisseur (non citée).</text>
