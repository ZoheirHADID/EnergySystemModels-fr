<text x="658.0" y="177.5" fill="#b46a00" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">H = 1.5</text>
<text x="716.0" y="305.0" fill="#c0392b" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12">q_total = 450.1 W</text>
<rect x="40.0" y="380.0" width="780.0" height="76.0" rx="4" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="1.0"/>
<text x="50.0" y="400.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Tp = 60 °C (paroi), Ta = 25 °C (air) ; dimensions en m. q_total = convection naturelle + rayonnement (e = 0.85).</text>
<text x="50.0" y="416.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Horizontale : surface W·L, longueur caractéristique Lc = W·L/(2W+2L) = 0.171 m.</text>
<text x="50.0" y="432.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Verticale : surface W·H, longueur caractéristique H.</text>
<text x="50.0" y="448.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">correlation='legacy' (défaut) diffère de Cengel ch. 9 ; correlation='cengel' lève OutOfRangeError hors domaine.</text>
