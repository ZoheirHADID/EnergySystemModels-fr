<text x="34.0" y="384.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Le point nominal (ΔP, débit) se lit sur la fiche du fabricant : le modèle ne connaît pas le média.</text>
<text x="34.0" y="400.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Pas de modèle d'encrassement : pour un filtre sale, on saisit sa perte de charge finale.</text>
