<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="Paramétrage d'un coude vif : d_hyd, delta">
<title>Paramétrage d'un coude vif : d_hyd, delta</title>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker><marker id="fleche_cote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b46a00"/></marker><marker id="fleche_flux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2670a8"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<polyline points="90.00,314.00 379.63,314.00 474.44,149.78" fill="none" stroke="#1f2933" stroke-width="2.0" stroke-linejoin="round"/>
<polyline points="90.00,246.00 340.37,246.00 415.56,115.78" fill="none" stroke="#1f2933" stroke-width="2.0" stroke-linejoin="round"/>
<polyline points="90.00,280.00 360.00,280.00 445.00,132.78" fill="none" stroke="#7b8794" stroke-width="1.0" stroke-dasharray="7 5" stroke-linejoin="round"/>
<line x1="112.0" y1="280.0" x2="172.0" y2="280.0" stroke="#2670a8" stroke-width="2.2" marker-end="url(#fleche_flux)"/>
<text x="142.0" y="234.0" fill="#2670a8" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">écoulement</text>
<line x1="220.0" y1="246.0" x2="220.0" y2="314.0" stroke="#b46a00" stroke-width="1.2" marker-start="url(#fleche_cote)" marker-end="url(#fleche_cote)"/>
<text x="220.0" y="280.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13"></text>
<text x="230.0" y="270.0" fill="#b46a00" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13">d_hyd</text>
<text x="180.0" y="336.0" fill="#b46a00" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">diamètre intérieur (m)</text>
<line x1="360.0" y1="280.0" x2="550.0" y2="280.0" stroke="#b46a00" stroke-width="1.2" stroke-dasharray="4 4"/>
<polyline points="470.00,280.00 469.85,274.24 469.40,268.50 468.65,262.79 467.60,257.13 466.25,251.53 464.62,246.01 462.69,240.58 460.49,235.26 458.01,230.06 455.26,225.00 452.25,220.09 448.99,215.34 445.49,210.77 441.75,206.40 437.78,202.22 433.60,198.25 429.23,194.51 424.66,191.01 419.91,187.75 415.00,184.74" fill="none" stroke="#b46a00" stroke-width="1.6" stroke-linejoin="round"/>
<text x="471.7" y="224.0" fill="#b46a00" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="14">delta</text>
<text x="550.0" y="300.0" fill="#b46a00" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">prolongement de l'axe d'entrée</text>
<text x="430.0" y="328.0" fill="#7b8794" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">arête vive : pas de rayon</text>
<text x="430.0" y="344.0" fill="#7b8794" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">(rayon &gt; 0 : CurvedBend)</text>
<rect x="40.0" y="30.0" width="560.6" height="60.0" rx="4" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="1.0"/>
<text x="50.0" y="50.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Deux entrées seulement : d_hyd (m, défaut 0.04) et delta (rad, défaut math.pi/2).</text>
<text x="50.0" y="66.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Pas de longueur, pas de rugosité : seule la perte locale ksi_loc(delta) est calculée.</text>
<text x="50.0" y="82.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">IHM « Coude vif » : Diamètre hydraulique (mm) et Déviation (°), convertis par le nœud.</text>
<rect x="40.0" y="406.0" width="620.0" height="44.0" rx="4" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="1.0"/>
<text x="50.0" y="426.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">ksi_loc = 0.95·sin²(delta/2) + 2.05·sin⁴(delta/2)   (Idel'chik)</text>
<text x="50.0" y="442.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">dP = ksi_loc · ½·rho·V²,   V = débit / (rho · π·d_hyd²/4)</text>
</svg>
