<text x="24.0" y="320.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">he = 23</text>
<text x="800.0" y="94.0" fill="#1f2933" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">Ti = 20 °C</text>
