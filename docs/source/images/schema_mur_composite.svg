<text x="320.0" y="416.0" fill="#7b8794" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11">e/λ</text>
<text x="320.0" y="454.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12">0.143</text>
<rect x="448.0" y="423.0" width="44.0" height="14.0" rx="1" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
<text x="470.0" y="416.0" fill="#7b8794" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11">e/λ</text>
<text x="470.0" y="454.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12">1.667</text>
<rect x="528.0" y="423.0" width="44.0" height="14.0" rx="1" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
<text x="550.0" y="416.0" fill="#7b8794" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11">e/λ</text>
<text x="550.0" y="454.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12">0.040</text>
<rect x="653.0" y="423.0" width="44.0" height="14.0" rx="1" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
<text x="675.0" y="416.0" fill="#7b8794" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11">1/hi</text>
<text x="675.0" y="454.0" fill="#b46a00" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="12">0.125</text>
<circle cx="60.0" cy="430.0" r="3.5" fill="#1f2933" stroke="none" stroke-width="0.0"/>
<circle cx="210.0" cy="430.0" r="3.5" fill="#1f2933" stroke="none" stroke-width="0.0"/>
