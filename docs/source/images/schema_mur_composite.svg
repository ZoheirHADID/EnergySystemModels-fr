<text x="52.0" y="434.0" fill="#1f2933" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="12">Te</text>
<text x="768.0" y="434.0" fill="#1f2933" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">Ti</text>
<text x="24.0" y="390.0" fill="#7b8794" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Résistances en série (m².K/W)</text>
<text x="450.0" y="496.0" fill="#1f2933" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13">R_total = 0.043 + 0.143 + 1.667 + 0.040 + 0.125 = 2.018 m².K/W</text>
<text x="450.0" y="518.0" fill="#1f2933" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="13">Q = A·(Ti − Te)/R_total = 10 × 30 / 2.018 = 148.7 W</text>
<rect x="24.0" y="568.0" width="852.0" height="60.0" rx="4" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="1.0"/>
<text x="34.0" y="588.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">he, hi en W/m².K ; λ en W/m.K ; e = thickness en m. Les couches s'empilent dans l'ordre des add_layer(),</text>
<text x="34.0" y="604.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">de l'extérieur vers l'intérieur. Valeurs calculées par CompositeWall.calculate() (wall.df, R_total, Q) ;</text>
<text x="34.0" y="620.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">épaisseurs dessinées hors échelle pour la lisibilité.</text>
