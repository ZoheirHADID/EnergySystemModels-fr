<text x="34.0" y="502.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Les quatre ports sont des FluidPort (P en Pa, T en K, h en J/kg, F en kg/s). calculate() lit Fluid_Inlet (T, cp, F, fluid)</text>
<text x="34.0" y="518.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">et Air_Inlet (T, cp, rho) ; il écrit To_fluid dans Fluid_Outlet, To_air dans Air_Outlet (P diminuée de 150 Pa).</text>
<text x="34.0" y="534.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Le débit d'air F de la source n'est pas lu : Air_Outlet.F = ρ_air · V_air · Sf · nb_baie_design (débit dimensionné).</text>
<text x="34.0" y="550.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Aucun nœud de la palette PyqtSimulator n'enveloppe ce modèle : icônes des nœuds « Échangeur DTLM » et « Effet de système (ventilateur) » en repère.</text>
