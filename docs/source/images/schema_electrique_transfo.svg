<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Pertes d'un transformateur : ce que calcule Electrical.TransformerEnergyBalance">
<title>Pertes d'un transformateur : ce que calcule Electrical.TransformerEnergyBalance</title>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker><marker id="fleche_cote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b46a00"/></marker><marker id="fleche_flux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2670a8"/></marker></defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="24.0" y="32.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Pertes d'un jeu de transformateurs — plaque, pertes fer et cuivre, nombre en service</text>
<polyline points="40.00,210.00 40.00,340.00" fill="none" stroke="#c0392b" stroke-width="3.2" stroke-linejoin="round"/>
<circle cx="24.0" cy="190.0" r="11" fill="#1d5f86"/>
<text x="24.0" y="194.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">1</text>
<text x="56.0" y="202.0" fill="#7b8794" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">S_ch (kVA) : charge totale du jeu de barres</text>
<line x1="40.0" y1="210.0" x2="470.0" y2="210.0" stroke="#c0392b" stroke-width="3.2"/>
<line x1="150.0" y1="210.0" x2="150.0" y2="250.0" stroke="#c0392b" stroke-width="2.6"/>
<rect x="98.0" y="250.0" width="104.0" height="54.0" rx="6" fill="#e6f1f8" stroke="#1d5f86" stroke-width="1.8"/>
<text x="150.0" y="322.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Transformateur</text>
<text x="150.0" y="338.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">n = 1</text>
<circle cx="98.0" cy="250.0" r="11" fill="#1d5f86"/>
<text x="98.0" y="254.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">2</text>
<line x1="300.0" y1="210.0" x2="300.0" y2="250.0" stroke="#c0392b" stroke-width="2.6"/>
<rect x="248.0" y="250.0" width="104.0" height="54.0" rx="6" fill="#e5f4ec" stroke="#1e7b4a" stroke-width="1.8"/>
<text x="300.0" y="322.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Transformateur</text>
<text x="300.0" y="338.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">n = 2</text>
<circle cx="248.0" cy="250.0" r="11" fill="#1e7b4a"/>
<text x="248.0" y="254.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">2</text>
<line x1="450.0" y1="210.0" x2="450.0" y2="250.0" stroke="#c0392b" stroke-width="2.6"/>
<rect x="398.0" y="250.0" width="104.0" height="54.0" rx="6" fill="#e5f4ec" stroke="#1e7b4a" stroke-width="1.8"/>
<text x="450.0" y="322.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Transformateur</text>
<text x="450.0" y="338.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">n = 3</text>
<circle cx="398.0" cy="250.0" r="11" fill="#1e7b4a"/>
<text x="398.0" y="254.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">2</text>
<text x="300.0" y="334.0" fill="#1d5f86" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11">① plaque : S_n, P0, Pcc, Ucc, I0</text>
<text x="300.0" y="352.0" fill="#1e7b4a" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="11">② n appareils identiques en parallèle</text>
<rect x="560.0" y="120.0" width="300.0" height="66.0" rx="6" fill="#e6f1f8" stroke="#1d5f86" stroke-width="1.8"/>
<text x="710.0" y="204.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Pertes fer</text>
<text x="710.0" y="220.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">P0 à U nominal — dès la mise sous tension</text>
<rect x="560.0" y="240.0" width="300.0" height="66.0" rx="6" fill="#e5f4ec" stroke="#1e7b4a" stroke-width="1.8"/>
<text x="710.0" y="324.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Pertes cuivre</text>
<text x="710.0" y="340.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">Pcc · (S_ch / (n·S_n))²</text>
<rect x="560.0" y="360.0" width="300.0" height="66.0" rx="6" fill="#e5f4ec" stroke="#1e7b4a" stroke-width="1.8"/>
<text x="710.0" y="444.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Énergie et coût</text>
<text x="710.0" y="460.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">P0 · hours_noload + cuivre · hours_load, × prix du kWh</text>
<line x1="710.0" y1="186.0" x2="710.0" y2="240.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#fleche)"/>
<line x1="710.0" y1="306.0" x2="710.0" y2="360.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#fleche)"/>
<rect x="600.0" y="500.0" width="220.0" height="58.0" rx="6" fill="#f3f4f5" stroke="#8a939c" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="710.0" y="576.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Charge de bascule n → n+1</text>
<text x="710.0" y="592.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">S* = S_n · √(n(n+1)·P0/Pcc)</text>
<text x="710.0" y="606.0" fill="#8a939c" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">calcul du guide (non fourni)</text>
<circle cx="38.0" cy="560.0" r="11" fill="#1d5f86"/>
<text x="38.0" y="564.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">1</text>
<text x="58.0" y="564.5" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Plaque</text>
<text x="200.0" y="564.5" fill="#1d5f86" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">S_n, P0, Pcc, Ucc, I0 ; hours_load, hours_noload ; cost_active, cost_reactive</text>
<circle cx="38.0" cy="587.0" r="11" fill="#1e7b4a"/>
<text x="38.0" y="591.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">2</text>
<text x="58.0" y="591.5" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Point de charge</text>
<text x="200.0" y="591.5" fill="#1e7b4a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">taux de charge = S_ch / (n·S_n) ; au-delà de 100 %, TransformerOverloadWarning</text>
<circle cx="38.0" cy="614.0" r="11" fill="#1e7b4a"/>
<text x="38.0" y="618.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">3</text>
<text x="58.0" y="618.5" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Pertes</text>
<text x="200.0" y="618.5" fill="#1e7b4a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">actives : P0 + Pcc·(S_ch/(n·S_n))² ; réactives : Q0 + Qcc·(S_ch/(n·S_n))²</text>
<circle cx="38.0" cy="641.0" r="11" fill="#1e7b4a"/>
<text x="38.0" y="645.5" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">4</text>
<text x="58.0" y="645.5" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Coût</text>
<text x="200.0" y="645.5" fill="#1e7b4a" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="11.5">energie_*_perdue_kWh × prix ; balance_transformers compare plusieurs (n, S_ch)</text>
</svg>
