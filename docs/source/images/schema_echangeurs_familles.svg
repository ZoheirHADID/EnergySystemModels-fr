<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Échangeurs — les deux familles de modèles">
<title>Échangeurs — les deux familles de modèles</title>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker><marker id="fleche_cote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b46a00"/></marker><marker id="fleche_flux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2670a8"/></marker></defs>
<rect width="980" height="560" fill="#ffffff"/>
<rect x="24.0" y="46.0" width="460.0" height="470.0" rx="10" fill="#eef4f8" stroke="#2670a8" stroke-width="1.6"/>
<rect x="496.0" y="46.0" width="460.0" height="470.0" rx="10" fill="#fdf3e7" stroke="#b46a00" stroke-width="1.6"/>
<text x="254.0" y="74.0" fill="#2670a8" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="600">Bilan / consigne</text>
<text x="254.0" y="94.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">on impose l'état ou la puissance, on déduit les sorties</text>
<text x="726.0" y="74.0" fill="#b46a00" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" font-weight="600">Dimensionnement</text>
<text x="726.0" y="94.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">on déduit la surface A (ou UA) qui réalise le bilan</text>
<rect x="40.0" y="118.0" width="428.0" height="62.0" rx="8" fill="#ffffff" stroke="#2670a8" stroke-width="1.4"/>
<text x="52.0" y="140.0" fill="#2670a8" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">TwoStreamEffectivenessNTUHEX</text>
<text x="52.0" y="160.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">impose : UA, les 2 entrées</text>
<text x="52.0" y="175.0" fill="#2670a8" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">déduit : T1o, T2o, ε, NUT, Qth</text>
<rect x="40.0" y="190.0" width="428.0" height="62.0" rx="8" fill="#ffffff" stroke="#2670a8" stroke-width="1.4"/>
<text x="52.0" y="212.0" fill="#2670a8" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">SingleStreamSetpointHEX</text>
<text x="52.0" y="232.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">impose : To ou Qth (ou u)</text>
<text x="52.0" y="247.0" fill="#2670a8" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">déduit : l'autre grandeur, Q_flow</text>
<rect x="40.0" y="262.0" width="428.0" height="62.0" rx="8" fill="#ffffff" stroke="#2670a8" stroke-width="1.4"/>
<text x="52.0" y="284.0" fill="#2670a8" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">TwoStreamDiscretizedCounterflowHEX</text>
<text x="52.0" y="304.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">impose : U, A, N mailles, 2 entrées</text>
<text x="52.0" y="319.0" fill="#2670a8" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">déduit : profil T(x), Q, convergence</text>
<rect x="40.0" y="334.0" width="428.0" height="62.0" rx="8" fill="#ffffff" stroke="#2670a8" stroke-width="1.4"/>
<text x="52.0" y="356.0" fill="#2670a8" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">SolutionHEX (SHE)</text>
<text x="52.0" y="376.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">impose : ε, riche 35 °C, pauvre 90 °C</text>
<text x="52.0" y="391.0" fill="#2670a8" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">déduit : Q, T riches / pauvres sortie</text>
<rect x="512.0" y="118.0" width="428.0" height="62.0" rx="8" fill="#ffffff" stroke="#b46a00" stroke-width="1.4"/>
<text x="524.0" y="140.0" fill="#b46a00" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">SingleStreamWallTemperatureHEX</text>
<text x="524.0" y="160.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">impose : U, A, T_paroi</text>
<text x="524.0" y="175.0" fill="#b46a00" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">déduit : Q, LMTD</text>
<rect x="512.0" y="190.0" width="428.0" height="62.0" rx="8" fill="#ffffff" stroke="#b46a00" stroke-width="1.4"/>
<text x="524.0" y="212.0" fill="#b46a00" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">TwoStreamLMTDInverseDesignHEX</text>
<text x="524.0" y="232.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">impose : T1o / T2o, 1 débit (l'autre déduit)</text>
<text x="524.0" y="247.0" fill="#b46a00" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">déduit : UA, DTLM, Qth</text>
<rect x="512.0" y="262.0" width="428.0" height="62.0" rx="8" fill="#ffffff" stroke="#b46a00" stroke-width="1.4"/>
<text x="524.0" y="284.0" fill="#b46a00" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">TwoStreamPinchConstrainedDesignHEX</text>
<text x="524.0" y="304.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">impose : U, pincement, 2 entrées</text>
<text x="524.0" y="319.0" fill="#b46a00" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">déduit : A, DTLM, Q_flow</text>
<rect x="512.0" y="334.0" width="428.0" height="62.0" rx="8" fill="#ffffff" stroke="#b46a00" stroke-width="1.4"/>
<text x="524.0" y="356.0" fill="#b46a00" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="600">AirCoolerDesignHEX</text>
<text x="524.0" y="376.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">impose : L_tube, To_fluid, air</text>
<text x="524.0" y="391.0" fill="#b46a00" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">déduit : nb baies, ventilation, To_air</text>
<line x1="40.0" y1="428.0" x2="472.0" y2="428.0" stroke="#7b8794" stroke-width="1.2" stroke-dasharray="5,4"/>
<line x1="512.0" y1="428.0" x2="944.0" y2="428.0" stroke="#7b8794" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="256.0" y="421.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600">le même cas, deux lectures</text>
<text x="726.0" y="421.0" fill="#7b8794" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600">le même cas, deux lectures</text>
<text x="40.0" y="446.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600">Cas commun (page) : eau 80 °C / 20 °C, 1 kg/s de part et d'autre</text>
<text x="40.0" y="468.0" fill="#2670a8" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">UA = 5 000 W/K  →  NUT = 1,195, ε = 0,545, Qth = 136,8 kW</text>
<text x="40.0" y="490.0" fill="#2670a8" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="12">sorties : T1o = 47,3 °C, T2o = 52,7 °C</text>
<text x="40.0" y="512.0" fill="#7b8794" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">Fluid_connect(Aval.Inlet, Amont.Outlet) ; Outlet1 / Outlet2 restent séparées.</text>
<rect x="512.0" y="440.0" width="428.0" height="76.0" rx="4" fill="#f4f6f8" stroke="#c9d1d9" stroke-width="1.0"/>
<text x="522.0" y="460.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">Dimensionnement du même cas</text>
<text x="522.0" y="476.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">U = 200 W/m²/K, pincement 5 K → A = 226,4 m², DTLM = 5,08 K</text>
<text x="522.0" y="492.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">Q = 230,1 kW, au-delà du bilan NUT (136,8 kW) :</text>
<text x="522.0" y="508.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5">  le mode ne reprend pas les débits, A suit le pincement.</text>
<text x="496.0" y="530.0" fill="#7b8794" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">Imposer A, c'est relâcher le pincement ou les débits :</text>
<text x="496.0" y="545.0" fill="#7b8794" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">le mode choisit la surface qui suit le pincement.</text>
</svg>
