<text x="620.0" y="154.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12"></text>
<text x="620.0" y="170.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Code Python : delta en RADIANS</text>
<text x="620.0" y="186.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">→ delta = math.radians(45)</text>
<text x="620.0" y="202.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">IHM : champ « Déviation (°) »</text>
<text x="620.0" y="218.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">→ en DEGRÉS : saisir 45</text>
