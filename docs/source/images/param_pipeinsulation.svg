<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-label="Paramétrage d'une tuyauterie isolée : DN, insulation_thickness, L_tube">
<title>Paramétrage d'une tuyauterie isolée : DN, insulation_thickness, L_tube</title>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker><marker id="fleche_cote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b46a00"/></marker><marker id="fleche_flux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2670a8"/></marker></defs>
<rect width="860" height="560" fill="#ffffff"/>
<text x="200.0" y="40.0" fill="#1f2933" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="600">coupe</text>
<circle cx="200.0" cy="250.0" r="118.2" fill="#fff3b0" stroke="#1f2933" stroke-width="1.4"/>
<circle cx="200.0" cy="250.0" r="62.2" fill="#9aa5b1" stroke="#1f2933" stroke-width="1.4"/>
