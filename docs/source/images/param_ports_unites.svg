<text x="70.0" y="354.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Mesuré : R134a à 5 bar et 20 °C donne Outlet.h = 411 606 J/kg — de l'air neuf à 5 °C</text>
<text x="70.0" y="370.0" fill="#1f2933" text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">et 80 % donne Inlet.h = 15,859 kJ/kg d'air sec. Confondre les deux, c'est un facteur 1000.</text>
